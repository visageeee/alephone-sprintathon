name: Build Sprintathon for macOS

on:
  workflow_dispatch:

jobs:
  release:
    name: macOS universal
    runs-on: macos-15

    steps:
      - name: Check out Sprintathon
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build Sprintathon
        uses: ./.github/actions/build-mac-osx
        with:
          xcode_targets: "Aleph One"

      - name: Package unsigned Sprintathon app
        run: |
          test -d "Xcode/build/Release/Sprintathon.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "Xcode/build/Release/Sprintathon.app" \
            "Sprintathon-macOS-universal.zip"

      - name: Upload Sprintathon
        uses: actions/upload-artifact@v6
        with:
          name: Sprintathon-macOS-universal
          if-no-files-found: error
          path: Sprintathon-macOS-universal.zip
          retention-days: 14
