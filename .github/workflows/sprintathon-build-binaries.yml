name: Sprintathon - build all binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag embedded in the binaries
        type: string
        required: false
        default: ''
    outputs:
      build_date:
        description: Shared package date (Europe/Stockholm)
        value: ${{ jobs.package-date.outputs.date }}

permissions:
  contents: read

jobs:
  package-date:
    name: Set package date
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        shell: bash
        run: echo "date=$(TZ=Europe/Stockholm date +%Y%m%d)" >> "$GITHUB_OUTPUT"

  windows:
    needs: package-date
    env:
      BUILD_DATE: ${{ needs.package-date.outputs.date }}
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Stamp Sprintathon build identity
        shell: bash
        env:
          SPRINTATHON_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/stamp-sprintathon-build.py
      - uses: ./.github/actions/build-windows
        with:
          platform: x64
          configurations: Release
          vcpkg_installed_folder: installed-x64-windows
      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location VisualStudio
          ./dist-windows.ps1 -x64 $true -a1 $true -m1 $false -m2 $false -m3 $false -output_path windows-build-archives -package_date $env:BUILD_DATE
          Pop-Location
          $archives = @(Get-ChildItem "VisualStudio/windows-build-archives/WINDOWS-Sprintathon-$env:BUILD_DATE.zip")
          if ($archives.Count -ne 1) { throw 'Expected exactly one Sprintathon Windows package' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $archives[0].FullName "release-assets/WINDOWS-Sprintathon-$env:BUILD_DATE.zip"
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: release-assets/WINDOWS-Sprintathon-${{ env.BUILD_DATE }}.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: package-date
    env:
      BUILD_DATE: ${{ needs.package-date.outputs.date }}
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Stamp Sprintathon build identity
        shell: bash
        env:
          SPRINTATHON_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/stamp-sprintathon-build.py
      - uses: ./.github/actions/build-mac-osx
        with:
          xcode_targets: Aleph One
      - name: Verify and package macOS
        shell: bash
        run: |
          set -euo pipefail
          app='Xcode/build/Release/Sprintathon.app'
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch x86_64 arm64
          mkdir -p "$app/Contents/Resources/snd" release-assets
          cp snd/*.ogg "$app/Contents/Resources/snd/"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-assets/MAC-Sprintathon-${BUILD_DATE}.zip"
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: release-assets/MAC-Sprintathon-${{ env.BUILD_DATE }}.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: package-date
    env:
      BUILD_DATE: ${{ needs.package-date.outputs.date }}
    name: Linux x86_64 Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Stamp Sprintathon build identity
        shell: bash
        env:
          SPRINTATHON_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/stamp-sprintathon-build.py
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder zip
          # Flatpak's build sandbox needs user namespaces on this ephemeral runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build and bundle the checked-out source
        shell: bash
        run: |
          set -euo pipefail
          # Keep all outputs outside the type:dir source tree to avoid recursive copying.
          flatpak-builder --user --assumeyes --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub --default-branch=stable \
            --state-dir="$RUNNER_TEMP/flatpak-state" --repo="$RUNNER_TEMP/flatpak-repo" \
            "$RUNNER_TEMP/flatpak-build" flatpak/io.github.visageeee.Sprintathon.yml
          test -x "$RUNNER_TEMP/flatpak-build/files/bin/sprintathon-engine"
          mkdir -p release-assets
          flatpak build-bundle --arch=x86_64 \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/flatpak-repo" "release-assets/LINUX-Sprintathon-${BUILD_DATE}.flatpak" \
            io.github.visageeee.Sprintathon stable
          (cd release-assets && zip -j "LINUX-Sprintathon-${BUILD_DATE}.zip" "LINUX-Sprintathon-${BUILD_DATE}.flatpak")
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: release-assets/LINUX-Sprintathon-${{ env.BUILD_DATE }}.zip
          if-no-files-found: error
          retention-days: 30
